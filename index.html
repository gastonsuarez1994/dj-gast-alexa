<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ GAST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.html.games.alexa.a2z.com/alexa-html/latest/alexa-html.js"></script>
<style>
  :root {
    --bg: #07070c;
    --panel: #11111b;
    --line: #23233a;
    --text: #e9e9f4;
    --muted: #8a8aa6;
    --cyan: #00e5ff;
    --magenta: #ff2bd6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden; }

  .app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  .stage { position: relative; display: flex; flex-direction: column; min-width: 0; }
  #player-wrap { position: relative; flex: 1; background: #000; }
  #player, #player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .now { padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  .now h1 { font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now p { font-size: 14px; color: var(--muted); margin-top: 2px; }

  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 18px 20px; font-family: Orbitron, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 3px;
           background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hint { padding: 0 20px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
  ol { list-style: none; overflow-y: auto; flex: 1; }
  li { display: flex; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
  li .n { font-family: Orbitron, sans-serif; color: var(--muted); width: 22px; flex: none; }
  li .t { font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  li .c { font-size: 12px; color: var(--muted); margin-top: 2px; }
  li.on { background: linear-gradient(90deg, rgba(0,229,255,.12), transparent); box-shadow: inset 3px 0 0 var(--cyan); }
  li.on .n { color: var(--cyan); }

  .idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 20px; background: radial-gradient(circle at 50% 40%, #161630, var(--bg) 70%); }
  .idle .logo { font-family: Orbitron, sans-serif; font-weight: 800; font-size: clamp(48px, 9vw, 110px); letter-spacing: 6px;
                background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip: text; background-clip: text; color: transparent;
                filter: drop-shadow(0 0 18px rgba(255,43,214,.35)); }
  .idle p { font-size: 20px; color: var(--muted); }
  .idle b { color: var(--text); }

  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); z-index: 5; }
  .overlay button { font: 600 22px Inter, sans-serif; color: #000; background: var(--cyan); border: 0; border-radius: 999px; padding: 18px 34px; }

  .toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: #000c; border: 1px solid var(--magenta);
           padding: 10px 18px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 6; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }

  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div id="player-wrap">
      <div id="player"></div>
      <div class="idle" id="idle">
        <div class="logo">DJ GAST</div>
        <p>Decí <b>"Alexa, poné…"</b> y el tema o video que quieras</p>
      </div>
      <div class="overlay" id="unmute"><button type="button">🔊 Tocá para activar el sonido</button></div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="now hidden" id="now">
      <h1 id="now-title"></h1>
      <p id="now-channel"></p>
    </div>
  </section>
  <aside>
    <div class="brand">DJ GAST</div>
    <div class="hint">"pausa" · "seguí" · "siguiente" · "poné el número 3"</div>
    <ol id="queue"></ol>
  </aside>
</div>

<script>
  // ---------- Estado ----------
  let alexaClient = null;
  let player = null;
  let playerReady = false;
  let queue = [];
  let index = 0;
  let pendingLoad = false;

  const $ = (id) => document.getElementById(id);

  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function sendToSkill(msg) {
    try { if (alexaClient) alexaClient.skill.sendMessage(msg); } catch (e) { console.warn(e); }
  }

  // ---------- Lista ----------
  function renderQueue() {
    const ol = $('queue');
    ol.innerHTML = '';
    queue.forEach((v, i) => {
      const li = document.createElement('li');
      if (i === index) li.className = 'on';
      li.innerHTML = '<span class="n"></span><div><div class="t"></div><div class="c"></div></div>';
      li.querySelector('.n').textContent = i + 1;
      li.querySelector('.t').textContent = v.title;
      li.querySelector('.c').textContent = v.channel;
      li.addEventListener('click', () => playIndex(i));
      ol.appendChild(li);
    });
    const on = ol.querySelector('.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
  }

  function showNow() {
    const v = queue[index];
    if (!v) return;
    $('idle').classList.add('hidden');
    $('now').classList.remove('hidden');
    $('now-title').textContent = v.title;
    $('now-channel').textContent = v.channel;
  }

  // ---------- Reproductor ----------
  function playIndex(i) {
    if (i < 0 || i >= queue.length) return;
    index = i;
    renderQueue();
    showNow();
    if (!playerReady) { pendingLoad = true; return; }
    player.loadVideoById(queue[index].id);
    ensureAudio();
  }

  // Si el navegador bloquea la reproducción con sonido, arranca en silencio y pide un toque
  function ensureAudio() {
    clearTimeout(ensureAudio._t);
    ensureAudio._t = setTimeout(() => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      const st = player.getPlayerState();
      if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) {
        player.mute();
        player.playVideo();
        $('unmute').style.display = 'flex';
      }
    }, 2500);
  }

  $('unmute').addEventListener('click', () => {
    if (player) { player.unMute(); player.setVolume(100); player.playVideo(); }
    $('unmute').style.display = 'none';
  });

  function next() {
    if (index + 1 < queue.length) playIndex(index + 1);
    else { toast('Se terminó la lista'); sendToSkill({ type: 'endOfQueue' }); }
  }
  function previous() {
    if (index > 0) playIndex(index - 1);
    else if (player) player.seekTo(0, true);
  }

  // API oficial del reproductor de YouTube
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      width: '100%',
      height: '100%',
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, fs: 0 },
      events: {
        onReady: () => {
          playerReady = true;
          if (pendingLoad) { pendingLoad = false; playIndex(index); }
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.ENDED) next();
          if (e.data === YT.PlayerState.PLAYING && !player.isMuted()) $('unmute').style.display = 'none';
        },
        onError: (e) => {
          // 101 / 150: el dueño no permite embeber el video → pasa al siguiente
          const embedBlocked = e.data === 101 || e.data === 150;
          toast(embedBlocked ? 'Ese video no se puede reproducir acá, paso al siguiente' : 'Error con el video, paso al siguiente');
          setTimeout(next, 1200);
        },
      },
    });
  };

  // ---------- Mensajes de la skill ----------
  function handleMessage(msg) {
    if (!msg || !msg.action) return;
    switch (msg.action) {
      case 'load':
        queue = Array.isArray(msg.videos) ? msg.videos : [];
        playIndex(msg.index || 0);
        break;
      case 'jump':
        if (msg.index >= queue.length) toast('No hay número ' + (msg.index + 1));
        else playIndex(msg.index);
        break;
      case 'pause':  if (player) player.pauseVideo(); break;
      case 'resume': if (player) player.playVideo(); break;
      case 'next':   next(); break;
      case 'previous': previous(); break;
      case 'idle':
      default: break;
    }
  }

  // ---------- Arranque ----------
  if (window.Alexa && typeof Alexa.create === 'function') {
    Alexa.create({ version: '1.1' })
      .then(({ alexa, message }) => {
        alexaClient = alexa;
        alexa.skill.onMessage(handleMessage);
        handleMessage(message);
      })
      .catch((err) => { console.warn('Sin Alexa:', err); testMode(); });
  } else {
    testMode();
  }

  // Para probar en una PC: index.html?v=VIDEO_ID
  function testMode() {
    const v = new URLSearchParams(location.search).get('v');
    if (v) handleMessage({ action: 'load', videos: [{ id: v, title: 'Prueba', channel: 'Modo prueba' }], index: 0 });
  }
</script>
</body>
</html>
